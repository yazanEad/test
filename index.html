<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قائمة المهام</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="todo-app">
      <section class="todo-panel" aria-labelledby="appTitle">
        <header class="app-header">
          <p>تنظيم اليوم</p>
          <h1 id="appTitle">قائمة المهام</h1>
        </header>

        <form class="todo-form" id="todoForm">
          <label class="sr-only" for="todoInput">أضف مهمة جديدة</label>
          <input
            id="todoInput"
            type="text"
            placeholder="اكتب مهمة جديدة..."
            autocomplete="off"
            required
          />
          <button type="submit">إضافة</button>
        </form>

        <ul class="todo-list" id="todoList" aria-live="polite"></ul>

        <footer class="todo-footer">
          <span id="taskCount">لا توجد مهام</span>
          <button class="clear-btn" id="clearDone" type="button">حذف المكتمل</button>
        </footer>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
